name: Build & Deploy

on:
  push:
    branches: [master]

  workflow_dispatch:

permissions: 
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  Build-Deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 16
          

      - run: |
          npm install
          
          
          npm run ghbuild
        
          
        
          

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

      - name: Sleep
        run: sleep 15s
        shell: bash    

      - id: deployment
        uses: actions/deploy-pages@v3
